name: Refresh station snapshot

# Installed LetzFuel apps read the snapshots from this repository at runtime,
# so republishing them weekly delivers OpenStreetMap improvements — new opening
# hours, services and fuel types — without an app release.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # One Overpass query per country, each allowed up to 15 minutes before the
    # generator gives up on it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The generator uses only the Node standard library, so there is nothing
      # to install.
      - name: Regenerate from OpenStreetMap
        run: node update-stations.mjs

      - name: Publish if the data changed
        run: |
          set -euo pipefail
          # Staged first so a file that did not exist before counts as a change.
          git add stations.snapshot.json stations.v2.snapshot.json
          if git diff --cached --quiet; then
            echo "OpenStreetMap data is unchanged; nothing to publish."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh station snapshots from OpenStreetMap'
          git push
